# Conexión a PostgreSQL. La contraseña se lee de la variable de entorno DB_PASSWORD:
# nunca se escribe aquí.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:almacen}
spring.datasource.username=${DB_USER:almacen}
spring.datasource.password=${DB_PASSWORD}

# La tabla y los datos de ejemplo se crean con schema.sql y data.sql al arrancar.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
